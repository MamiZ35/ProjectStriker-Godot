name: Build & Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  GODOT_TAG: "4.7.2-stable"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Download Godot
        run: |
          curl -sL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64 godot
          chmod +x godot

      - name: Build
        run: dotnet build -c Release

      - name: Unit tests
        run: dotnet test -c Release

      - name: Flow tests (phase2)
        run: ./godot --headless -s tools/phase2_flow_test.gd

      - name: Flow tests (phase5)
        run: ./godot --headless -s tools/phase5_flow_test.gd

  apk:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Android SDK
        uses: subosito/android-action-setup@v2
        with:
          api-level: 35
          sdk-version: "35.0.0"
          install-latest-sdks: false
          sdk-tools:
            - "platform-tools"
            - "platforms;android-35"
            - "build-tools;35.0.0"

      - name: Download Godot
        run: |
          curl -sL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64 godot
          chmod +x godot

      - name: Download export templates
        run: |
          curl -sL -o godot_export.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot_export.tpz
          sudo mkdir -p ~/.local/share/godot/export_templates
          sudo cp -r templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build
        run: dotnet build -c Release

      - name: Export Android APK
        run: ./godot --headless --export-release "Android" build/Striker.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: striker-android
          path: build/Striker.apk
          if-no-files-found: error
